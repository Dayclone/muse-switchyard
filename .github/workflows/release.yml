name: Release

# Push a tag like v0.3.1 (after merging the version bump PR) to publish a release.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Tag must match the manifest version
        run: |
          V=$(node -p "require('./manifest.json').version")
          if [ "v$V" != "${GITHUB_REF_NAME}" ]; then echo "tag ${GITHUB_REF_NAME} != manifest v$V"; exit 1; fi
      - name: Build extension zip
        run: |
          zip -r "switchyard-${GITHUB_REF_NAME}.zip" manifest.json background.js popup.html popup.js popup.css content lib icons LICENSE README.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "switchyard-${GITHUB_REF_NAME}.zip" \
            --title "Switchyard ${GITHUB_REF_NAME}" --generate-notes
      - uses: actions/upload-artifact@v4
        with:
          name: extension-zip
          path: switchyard-*.zip
          if-no-files-found: error

  # Uploads the same zip to the extension stores. Needs a maintainer to approve the
  # "store-publish" environment, and each store step is skipped until its secrets exist.
  # The first submission of each listing is manual; this only publishes updates.
  store-publish:
    needs: release
    runs-on: ubuntu-latest
    environment: store-publish
    permissions:
      contents: read
    env:
      CHROME_EXTENSION_ID: ${{ vars.CHROME_EXTENSION_ID }}
      CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
      CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
      CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
      EDGE_PRODUCT_ID: ${{ vars.EDGE_PRODUCT_ID }}
      EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
      EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: extension-zip
      - name: Locate zip
        run: echo "ZIP=$(ls switchyard-*.zip | head -n1)" >> "$GITHUB_ENV"
      - name: Chrome Web Store
        if: env.CHROME_EXTENSION_ID != '' && env.CHROME_CLIENT_ID != '' && env.CHROME_REFRESH_TOKEN != ''
        uses: mnao305/chrome-webstore-upload-action@v1
        with:
          zip-path: ${{ env.ZIP }}
          extension-id: ${{ env.CHROME_EXTENSION_ID }}
          client-id: ${{ env.CHROME_CLIENT_ID }}
          client-secret: ${{ env.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ env.CHROME_REFRESH_TOKEN }}
          publish: true
      - name: Microsoft Edge Add-ons
        if: env.EDGE_PRODUCT_ID != '' && env.EDGE_CLIENT_ID != '' && env.EDGE_API_KEY != ''
        uses: wdzeng/edge-addon@v2
        with:
          product-id: ${{ env.EDGE_PRODUCT_ID }}
          zip-path: ${{ env.ZIP }}
          client-id: ${{ env.EDGE_CLIENT_ID }}
          api-key: ${{ env.EDGE_API_KEY }}
