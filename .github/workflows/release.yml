name: Release

# Two ways to publish a release:
#   1. Tag push: merge the version bump PR, then push a tag like v0.3.1.
#   2. Manual dispatch (no tag needed; the workflow creates it on main):
#        gh workflow run Release -f version=0.3.1
# Both paths run the tests, check the manifest version, and publish
# switchyard-vX.Y.Z.zip. Triggers are only tag pushes and manual dispatch,
# so no pull-request code ever runs here.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release as x.y.z (no leading "v"), e.g. 0.3.1'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Resolve and validate tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "version input must look like x.y.z (no leading v), got: $VERSION"
              exit 1
            fi
            TAG="v${VERSION}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "TAG=${TAG}" >> "$GITHUB_ENV"
          echo "Releasing ${TAG}"
      - run: npm ci
      - run: npm test
      - name: Tag must match the manifest version
        run: |
          V=$(node -p "require('./manifest.json').version")
          if [ "v$V" != "${TAG}" ]; then echo "tag ${TAG} != manifest v$V"; exit 1; fi
      - name: Ensure tag and release do not already exist (manual dispatch only)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "tag ${TAG} already exists"
            exit 1
          fi
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "release ${TAG} already exists"
            exit 1
          fi
      - name: Build extension zip
        run: |
          zip -r "switchyard-${TAG}.zip" manifest.json background.js popup.html popup.js popup.css content lib icons LICENSE README.md
      - name: Publish release (tag push)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${TAG}" "switchyard-${TAG}.zip" \
            --title "Switchyard ${TAG}" --generate-notes
      - name: Publish release (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${TAG}" "switchyard-${TAG}.zip" \
            --target main --title "Switchyard ${TAG}" --generate-notes
      - uses: actions/upload-artifact@v4
        with:
          name: extension-zip
          path: switchyard-*.zip
          if-no-files-found: error

  # Uploads the same zip to the extension stores. Needs a maintainer to approve the
  # "store-publish" environment, and each store step is skipped until its secrets exist.
  # The first submission of each listing is manual; this only publishes updates.
  store-publish:
    needs: release
    runs-on: ubuntu-latest
    environment: store-publish
    permissions:
      contents: read
    env:
      CHROME_EXTENSION_ID: ${{ vars.CHROME_EXTENSION_ID }}
      CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
      CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
      CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
      EDGE_PRODUCT_ID: ${{ vars.EDGE_PRODUCT_ID }}
      EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
      EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: extension-zip
      - name: Locate zip
        run: echo "ZIP=$(ls switchyard-*.zip | head -n1)" >> "$GITHUB_ENV"
      - name: Chrome Web Store
        if: env.CHROME_EXTENSION_ID != '' && env.CHROME_CLIENT_ID != '' && env.CHROME_REFRESH_TOKEN != ''
        uses: mnao305/chrome-webstore-upload-action@v1
        with:
          zip-path: ${{ env.ZIP }}
          extension-id: ${{ env.CHROME_EXTENSION_ID }}
          client-id: ${{ env.CHROME_CLIENT_ID }}
          client-secret: ${{ env.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ env.CHROME_REFRESH_TOKEN }}
          publish: true
      - name: Microsoft Edge Add-ons
        if: env.EDGE_PRODUCT_ID != '' && env.EDGE_CLIENT_ID != '' && env.EDGE_API_KEY != ''
        uses: wdzeng/edge-addon@v2
        with:
          product-id: ${{ env.EDGE_PRODUCT_ID }}
          zip-path: ${{ env.ZIP }}
          client-id: ${{ env.EDGE_CLIENT_ID }}
          api-key: ${{ env.EDGE_API_KEY }}
